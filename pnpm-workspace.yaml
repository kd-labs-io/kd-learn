packages:
  - apps/*
  - packages/*

catalog:
  # Pin every @astryxdesign/* package to the same exact version (plan, risk 9).
  '@astryxdesign/core': 0.7.16
  '@astryxdesign/cli': 0.7.16
  '@astryxdesign/build': 0.7.16
  '@stylexjs/stylex': 0.19.2
  '@stylexjs/unplugin': 0.19.2
  '@stylexjs/babel-plugin': 0.19.2
  '@tanstack/react-router': 1.170.46
  '@tanstack/react-start': 1.169.5
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  effect: ^4.1.4
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: 6.0.3
  vite: ^8.3.8
  vitest: ^5.1.0

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - typescript-eslint@8.73.0

# Install scripts. Astryx postinstall only prints a setup nudge, so it stays off.
allowBuilds:
  '@astryxdesign/core': false
  '@astryxdesign/cli': false
  '@google/genai': false
  '@journeyapps/wa-sqlite': false
  protobufjs: false

permissions:
  '@tanstack/ai':
    skills: true
  '@tanstack/react-router':
    skills: [router-query, migrate-from-react-router, react-router]
  '@tanstack/react-start':
    skills: [migrate-from-nextjs, react-start]

skills:
  dirs:
    - .agents/skills
    - .claude/skills
